<!doctype html>
<html><head><meta charset="UTF-8"/><title>debug</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<div id="status">loading scripts...</div>
<script>
const status = document.getElementById('status');
const files = ['tweaks-panel.jsx','data.jsx','ui.jsx','shell.jsx','dashboard.jsx','list.jsx','sku.jsx','ai.jsx','rules.jsx','arch.jsx','app.jsx'];
async function loadAll() {
  for (const f of files) {
    status.textContent = 'compiling ' + f + '...';
    const t0 = performance.now();
    try {
      const src = await (await fetch(f)).text();
      const compiled = Babel.transform(src, { presets: ['react'] }).code;
      (0, eval)(compiled);
      console.log('OK', f, (performance.now() - t0).toFixed(0) + 'ms');
    } catch (e) {
      status.textContent = 'FAILED at ' + f + ': ' + e.message;
      console.error(f, e);
      return;
    }
  }
  status.textContent = 'all loaded';
}
loadAll();
</script>
</body></html>
